[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "community-analysis"
version = "0.1.0"
description = "Community Analysis Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "networkx>=2.6.0",
    "neo4j>=5.0.0",
    "gensim>=4.0.0",
    "scikit-learn>=1.7,<2",
    "spacy>=3.0.0",
    "tiktoken>=0.7.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "plotly>=5.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "python-dotenv>=1.0.0",
    "kneed>=0.8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "demoji>=1.1.0",
    "beautifulsoup4>=4.10.0",
    "langdetect>=1.0.9",
    "deep-translator>=1.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pyarrow>=12.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "jinja2>=3.0.0",
]

[project.scripts]
community-analysis = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=6.0",
    "httpx>=0.28.0",
    "pre-commit>=4.6.0",
]

[project.optional-dependencies]
orchestration = [
    "prefect>=3.7.8,<4",
]
tracking = [
    "mlflow-skinny==3.14.0",
]
benchmark-gemini = [
    "google-genai>=2.0.0,<3",
]
eval = [
    "deepeval>=1.0.0",
    "mlflow>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"src.topics" = ["stopwords-list.txt"]
"src.themes.benchmark.prompts" = ["*.jinja2"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
markers = [
    "requires_loopback: test requires the ability to bind a loopback TCP socket (skipped in restricted sandbox environments)",
    "requires_prefect: test requires the optional Prefect orchestration dependency",
]
