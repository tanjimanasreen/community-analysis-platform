[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "community-analysis"
version = "0.1.0"
description = "Community Analysis Intelligence Platform"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3.0",
    "networkx>=2.6.0",
    "neo4j>=5.0.0",
    "gensim>=4.0.0",
    "spacy>=3.0.0",
    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
    "plotly>=5.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "python-dotenv>=1.0.0",
    "kneed>=0.8.0",
    "pyyaml>=6.0",
    "demoji>=1.1.0",
    "beautifulsoup4>=4.10.0",
    "langdetect>=1.0.9",
    "deep-translator>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=6.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
