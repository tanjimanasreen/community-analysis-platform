data_type: twitter
content_type: reply
month: "03"
year: "2017"
input_path: tests/fixtures/sample_relationships.csv
output_base_path: local_output/tests/community-analysis-sample/
creator_relation: REPLIED_TO
spreader_relation: REPLIED_BY
creator_node_column: target
spreader_node_column: target
text_node_column: source
date_column: created_at

database:
  engine: memgraph
  uri: ${GRAPH_DB_URI}
  user: ${GRAPH_DB_USER}
  password: ${GRAPH_DB_PASSWORD}

graph_thresholds:
  min_total_post: 1
  min_shared_post: 1
  min_members: 2

lda:
  num_topics: 15
  top_n_keywords: 50

theme:
  model: "llm7:gpt-oss:20b"
  sleep_seconds: 2
  transition_threshold: 0.0
  output_dir: local_output/tests/community-analysis-theme-sample
  year: "2017"
  render_visuals: false
  similarity_model: paraphrase-MiniLM-L6-v2

tracking:
  enabled: true
  experiment_name: "community-analysis"
  backend: "mlflow"
  backend_store_path: ".mlflow/mlflow.db"
  artifact_root: ".mlflow/artifacts"
  nested_stage_runs: true
  failure_policy: "warn"
  log_artifact_references: true

benchmark:
  evaluator_judge: "mock"
  offline_dataset:
    enabled: true

