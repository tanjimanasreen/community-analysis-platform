# Telegram forwarded message dataset
include:
  - "../algorithms.yml"
  - "../providers.yml"

data_type: telegram
content_type: forward
output_base_path: local_output/telegram/forwarded_message/

creator_relation: PRODUCED
spreader_relation: FORWARDED_BY
creator_node_column: source
spreader_node_column: target
text_node_column: target
date_column: forwarded_date

theme:
  fallback: true

# Replace with the actual dataset configurations
datasets: []

orchestration:
  cache_expiration_days: 30
  max_workers: 4
