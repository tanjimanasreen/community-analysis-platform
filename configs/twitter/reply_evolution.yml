# Twitter reply evolution analysis
include:
  - "../algorithms.yml"
  - "../providers.yml"

data_type: twitter
content_type: reply
year: "2017"
output_base_path: local_output/twitter/reply_evolution/

creator_relation: REPLIED_TO
spreader_relation: REPLIED_BY
creator_node_column: target
spreader_node_column: target
text_node_column: source
date_column: created_at

theme:
  render_visuals: false
  similarity_model: paraphrase-MiniLM-L6-v2
  max_workers: 4

theme_provider:
  fallback: false
  cache_backend: sqlite
  cache_path: .cache/theme_cache.sqlite3
  cache_failure_policy: bypass

longitudinal_datasets:
  - month: "01"
    input_path: ${DATA_ROOT}/twitter/reply/2017/reply_january_2017.csv
  - month: "02"
    input_path: ${DATA_ROOT}/twitter/reply/2017/reply_february_2017.csv
  - month: "03"
    input_path: ${DATA_ROOT}/twitter/reply/2017/reply_march_2017.csv
  - month: "04"
    input_path: ${DATA_ROOT}/twitter/reply/2017/reply_april_2017.csv

orchestration:
  # Keep month-level work serial because each month already uses LdaMulticore.
  month_workers: 1
  cache_expiration_days: 30
  max_workers: 4
