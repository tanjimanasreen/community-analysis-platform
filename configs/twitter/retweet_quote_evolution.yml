# Twitter retweet/quote evolution analysis
include:
  - "../algorithms.yml"
  - "../providers.yml"

data_type: twitter
content_type: retweet_quote
year: "2017"
output_base_path: local_output/twitter/retweet_quote_evolution/

creator_relation: TWEETED
spreader_relation: RETWEETED_BY
creator_node_column: source
spreader_node_column: target
text_node_column: target
date_column: created_at

theme:
  render_visuals: false
  evolution_similarity_enabled: true
  similarity_model: paraphrase-MiniLM-L6-v2
  max_workers: 4

theme_provider:
  fallback: false
  cache_backend: sqlite
  cache_path: .cache/theme_cache.sqlite3
  cache_failure_policy: bypass


longitudinal_datasets:
  - month: "01"
    input_path: ${DATA_ROOT}/twitter/retweet_quote/2017/retweet_january_2017.csv
  - month: "02"
    input_path: ${DATA_ROOT}/twitter/retweet_quote/2017/retweet_february_2017.csv
  - month: "03"
    input_path: ${DATA_ROOT}/twitter/retweet_quote/2017/retweet_march_2017.csv
  - month: "04"
    input_path: ${DATA_ROOT}/twitter/retweet_quote/2017/retweet_april_2017.csv

translation:
  # Opt-in for Twitter; keep current analytical input unchanged by default.
  enabled: false
  provider: azure
  target_language: en
  contract_version: v1
  cache_path: .cache/translation_cache.sqlite3
  timeout_seconds: 30

orchestration:
  # Keep month-level work serial because each month already uses LdaMulticore.
  month_workers: 1
  # Reuse validated stage artifacts across equivalent runs.
  artifact_reuse: true
  max_workers: 4
