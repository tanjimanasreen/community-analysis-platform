# Shared base configuration for all longitudinal twitter reply month configs.
# Do NOT run this file directly — include it from a month-specific override file.
#
# Inherits algorithm defaults and provider registry from the top-level configs.
include:
  - "../algorithms.yml"
  - "../providers.yml"

data_type: twitter
content_type: reply
year: "2017"
output_base_path: ${LONGITUDINAL_OUTPUT}

creator_relation: REPLIED_TO
spreader_relation: REPLIED_BY
creator_node_column: target
spreader_node_column: target
text_node_column: source
date_column: created_at

database:
  engine: memgraph
  uri: ${GRAPH_DB_URI}
  user: ${GRAPH_DB_USER}
  password: ${GRAPH_DB_PASSWORD}

# Sample-specific overrides (looser than production defaults for small fixtures)
graph_thresholds:
  min_total_post: 1
  min_shared_post: 1
  min_members: 2

lda:
  num_topics: 15
  top_n_keywords: 50

theme:
  # fallback: controls whether the theme pipeline uses a fallback provider chain.
  # Set to false to use primary only (e.g. during unit tests).
  fallback: true
  fallback_chain:
    - "llm7:fast"
    - "nvidia:meta/llama-3.3-70b-instruct"
  sleep_seconds: 2
  transition_threshold: 0.0
  output_dir: ${LONGITUDINAL_THEME_OUTPUT}
  render_visuals: false
  similarity_model: paraphrase-MiniLM-L6-v2

orchestration:
  cache_expiration_days: 30
  max_workers: 4
